services:
  - type: web
    name: orbitstream
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: ORBITSTREAM_COLLECTOR_API_KEY
        value: orbitstream-collector-key-2026
      - key: DATABASE_URL
        fromDatabase:
          name: orbitstream-db
          property: connectionString

databases:
  - name: orbitstream-db
    plan: free
    region: oregon
    databaseName: orbitstream
    user: orbitstream_user
