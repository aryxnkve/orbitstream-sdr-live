services:
  - type: web
    name: orbitstream
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ORBITSTREAM_COLLECTOR_API_KEY
        value: orbitstream-collector-key-2026
